# Include inside the nasbridge.online HTTPS server block.
# Only Vite content-hashed assets receive immutable caching; HTML and API
# responses continue through the existing location / and API routes.
location ~ "^/assets/.+-[A-Za-z0-9_-]{8,}\\.[A-Za-z0-9]+$" {
    proxy_pass http://127.0.0.1:8080;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript image/svg+xml;
    proxy_hide_header Cache-Control;
    add_header Cache-Control "public, max-age=31536000, immutable";
}
